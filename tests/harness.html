<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AnonLab — harness de teste</title>
<!--
  SÓ PARA TESTE (servido por http://localhost). Carrega o anonimizador.html num
  iframe e injeta o pacote NER como objetos File — o mesmo que o seletor de
  pasta entrega —, já que a CSP do anonimizador bloqueia fetch até do localhost.
    const en = await harness.loadPack("/dist/anonlab-ner/", ["fp16"]);
    await harness.app().openNerPack(en);
-->
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app"></iframe>
<script>
// começa limpo: sem "carregar sozinho" de um teste anterior (a menos que ?auto)
if(!location.search.includes("auto")) localStorage.removeItem("anonlab.ner.auto");
document.getElementById("app").src = "../anonimizador.html?t=" + Date.now();
</script>
<script>
async function getJSON(u){ const r = await fetch(u, { cache: "no-store" }); if(!r.ok) throw new Error(u+" "+r.status); return r.json(); }
async function loadPack(base = "../dist/anonlab-ner/", dtypes = null){
  const man = await getJSON(base + "anonlab-ner.json");
  const paths = ["anonlab-ner.json", ...Object.keys(man.runtime.files).map(n => "runtime/" + n)];
  for(const info of Object.values(man.models)){
    const mm = await getJSON(base + info.path + "/anonlab-model.json");
    paths.push(info.path + "/anonlab-model.json", ...Object.keys(mm.files).map(p => info.path + "/" + p));
    for(const [d, v] of Object.entries(mm.variants)) if(!dtypes || dtypes.includes(d)) paths.push(info.path + "/" + v.file);
  }
  const entries = [];
  for(const p of paths){
    const r = await fetch(base + p, { cache: "no-store" }); if(!r.ok) throw new Error(p + " " + r.status);
    entries.push({ path: "anonlab-ner/" + p, file: new File([await r.blob()], p.split("/").pop()) });
  }
  return entries;
}
// Vazamento: roda Detectar (aceitando só o que já vem aceito por padrão) em cada
// documento de golden/docs.json e lista os dados pessoais que sobraram no resultado.
async function evalGolden(){
  const {docs} = await getJSON("golden/docs.json");
  const w = document.getElementById("app").contentWindow, d = w.document;
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const found = (out, t) => new RegExp("(?<![\\p{L}\\p{N}])" + esc(t) + "(?![\\p{L}\\p{N}])", "u").test(out);
  // vazamento parcial: sobrou um pedaço (sobrenome, número da rua, grupo de dígitos)
  const STOP = new Set(["rua","avenida","travessa","alameda","jardim","vila","bairro","santa","são","colégio","estadual",
                        "municipal","das","dos","da","de","do","e"]);
  const parts = p => /^(PESSOA|ENDERECO)$/.test(p.tipo)
    ? p.text.split(/[\s,]+/).filter(t => t.length >= 3 && !STOP.has(t.toLowerCase()))
    : (/\d/.test(p.text) ? (p.text.match(/\d{3,}/g) || []) : []);
  const res = [];
  for(const doc of docs){
    d.getElementById("input").value = doc.text;
    d.getElementById("freeterms").value = "";
    await w.AnonLab.detect();
    const out = d.getElementById("output").value;
    const leaks = doc.pii.filter(p => found(out, p.text));
    // um pedaço só conta se, no original, ele aparece apenas dentro de dados pessoais
    // (o "2023" de "Ofício nº 245/2023" não é vazamento da data "7 de novembro de 2023")
    const occ = (hay, t) => (hay.match(new RegExp("(?<![\\p{L}\\p{N}])" + esc(t) + "(?![\\p{L}\\p{N}])", "gu")) || []).length;
    const onlyInPii = t => occ(doc.text, t) <= doc.pii.reduce((a, q) => a + occ(q.text, t) * occ(doc.text, q.text), 0);
    const partial = doc.pii.filter(p => !leaks.includes(p) && parts(p).some(t => onlyInPii(t) && found(out, t)));
    res.push({ id: doc.id, pii: doc.pii.length, vazou: leaks.length, parcial: partial.length,
               vazamentos: leaks.map(p => p.tipo + ": " + p.text),
               parciais: partial.map(p => p.tipo + ": " + p.text + " → sobrou " + parts(p).filter(t => onlyInPii(t) && found(out, t)).join(", ")),
               excesso: doc.fp_ok.filter(t => !out.includes(t)),
               aceitos: w.AnonLab.entities().filter(e => e.accepted).length, saida: out });
  }
  const sum = rs => {
    const t = rs.reduce((a, r) => ({ pii: a.pii + r.pii, vazou: a.vazou + r.vazou, parcial: a.parcial + r.parcial, excesso: a.excesso + r.excesso.length }),
                        { pii: 0, vazou: 0, parcial: 0, excesso: 0 });
    return { recall: +(1 - t.vazou / t.pii).toFixed(3), recall_estrito: +(1 - (t.vazou + t.parcial) / t.pii).toFixed(3), ...t };
  };
  // "novos": documentos escritos depois dos ajustes de pós-processamento (comparação mais justa)
  const novos = new Set(docs.filter(x => x.novo).map(x => x.id));
  return { ...sum(res), antigos: sum(res.filter(r => !novos.has(r.id))), novos: sum(res.filter(r => novos.has(r.id))), docs: res };
}

// modo "🌐 Baixar modelos" contra o Hugging Face falso de tests/fake_hf.py
async function openFakeHub(){
  const A = document.getElementById("app").contentWindow.AnonLab;
  A.NER_HUB.host = location.origin + "/fakehf/";
  await A.openNerHub();
}

// avalia um catálogo qualquer (formato do NER_HUB) pelo mesmo caminho do botão "Baixar modelos"
async function evalHub(models, host = "https://huggingface.co/"){
  const A = document.getElementById("app").contentWindow.AnonLab;
  A.NER_HUB.host = host;
  A.NER_HUB.models = models;
  const t0 = performance.now();
  await A.openNerHub();
  const loadMs = Math.round(performance.now() - t0);
  const loaded = A.NER.loaded().map(m => `${m.slug}:${m.dtype}`);
  const t1 = performance.now();
  const r = await evalGolden();
  const brief = x => ({ recall: x.recall, estrito: x.recall_estrito, vazou: x.vazou, parcial: x.parcial, excesso: x.excesso, pii: x.pii });
  return { loaded, loadMs, detectMs: Math.round(performance.now() - t1), total: brief(r), antigos: brief(r.antigos), novos: brief(r.novos),
           vazamentos: r.docs.flatMap(d => d.vazamentos.concat(d.parciais).map(v => d.id + " · " + v)),
           excessos: r.docs.flatMap(d => d.excesso.map(v => d.id + " · " + v)) };
}

window.harness = { loadPack, evalGolden, openFakeHub, evalHub, app: () => document.getElementById("app").contentWindow,
                   doc: () => document.getElementById("app").contentDocument };
</script>
</body>
</html>
